name: Experimental Release Build

on:
  push:
    branches: [ master ]
    paths:
      - 'OpenEmu/**'
      - 'release-build.sh'
      - '.github/workflows/experimental-release.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 120
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        submodules: recursive
        fetch-depth: 0
    
    - name: Setup Xcode
      run: |
        sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
        xcodebuild -version
    
    - name: Verify build environment
      run: |
        echo "Checking critical files..."
        [ -f release-build.sh ] && echo "✅ release-build.sh found" || exit 1
        [ -d OpenEmu.xcworkspace ] && echo "✅ OpenEmu.xcworkspace found" || exit 1
        [ -d OpenEmu-experimental.xcworkspace ] && echo "✅ OpenEmu-experimental.xcworkspace found" || exit 1
        chmod +x release-build.sh
    
    - name: Build experimental release
      run: |
        ./release-build.sh --experimental --skip-build || true
      env:
        OPENEMU_TEAM_ID: D6WY385Q4D
        OPENEMU_CODE_SIGN_IDENTITY: "Apple Development"
      continue-on-error: true
    
    - name: Check build artifacts
      run: |
        if [ -d release/OpenEmu.app ]; then
          echo "✅ Release build created successfully"
          du -sh release/
        else
          echo "⚠️  Release directory not found"
          ls -la
        fi
    
    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: openemu-experimental-release
        path: release/
        retention-days: 30
        if-no-files-found: warn
    
    - name: Create Release Notes
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        echo "## OpenEmu Experimental Release" > release-notes.md
        echo "Version: 2.5.0 (Build 7414)" >> release-notes.md
        echo "Date: $(date)" >> release-notes.md
    
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: OpenEmu Experimental ${{ github.ref }}
        body_path: release-notes.md
        draft: false
        prerelease: true
