name: Experimental Release Build

on:
  push:
    branches: [ master ]
    paths:
      - 'OpenEmu/**'
      - '.github/workflows/experimental-release.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive
    
    - name: Set up build environment
      run: |
        xcode-select --install || true
    
    - name: Build experimental release
      run: |
        ./release-build.sh --experimental
      env:
        OPENEMU_TEAM_ID: D6WY385Q4D
        OPENEMU_CODE_SIGN_IDENTITY: "Apple Development"
    
    - name: Create distribution archive
      run: |
        cd release
        tar -czf OpenEmu-2.5.0-experimental.tar.gz OpenEmu.app cores/ Frameworks/
        cd ..
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: openemu-experimental-release
        path: |
          release/OpenEmu.app
          release/cores/
          release/Frameworks/
        retention-days: 30
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: OpenEmu Experimental Release ${{ github.ref }}
        body: |
          ## OpenEmu Experimental Release
          Version: 2.5.0, Build: 7414
          
          ### Contents
          - Main application (OpenEmu.app)
          - 31 system plugin cores
          - 5 frameworks
          
          ### Features
          - macOS 12.0+ support
          - Developer ID signed
          - Universal binaries (x86_64 + arm64)
          - Dolphin GameCube/Wii emulation
        draft: false
        prerelease: true
