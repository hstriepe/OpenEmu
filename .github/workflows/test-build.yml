name: Test Build

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  verify-configuration:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Verify build configuration
      run: |
        echo "Checking OpenEmu configuration files..."
        grep -E "OPENEMU_TEAM_ID|OPENEMU_MARKETING_VERSION" OpenEmu/AppBundleAndSigning.xcconfig || exit 1
        echo "✅ Configuration verified"
    
    - name: Validate workspace
      run: |
        echo "Checking workspace files..."
        [ -f release-build.sh ] && echo "✅ release-build.sh found" || exit 1
        [ -d OpenEmu.xcworkspace ] && echo "✅ OpenEmu.xcworkspace found" || exit 1
        [ -d OpenEmu-experimental.xcworkspace ] && echo "✅ OpenEmu-experimental.xcworkspace found" || exit 1
    
    - name: Check submodules
      run: |
        echo "Verifying submodules..."
        git submodule status | head -10
        echo "✅ Submodules checked"
